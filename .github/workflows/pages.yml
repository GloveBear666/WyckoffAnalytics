# Deploy 静态前端 (web/static) 到 GitHub Pages
# 每次 push 到 main 自动更新: https://glovebear666.github.io/WyckoffAnalytics/
# 注: 后端为本地 Flask (core/quiz.py 等重计算), 前端通过页面顶部"后端地址"设置指向本机/隧道
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
