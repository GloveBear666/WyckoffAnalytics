<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WyckoffAnalytics — 威科夫温度控制终端</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --txt: #e6edf3;
    --dim: #8b949e; --acc: #58a6ff; --up: #3fb950; --down: #f85149;
    --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--txt); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin-bottom: 2px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tab {
    background: transparent; border: 1px solid var(--border); color: var(--dim);
    border-radius: 6px 6px 0 0; padding: 7px 18px; font-size: 13px; cursor: pointer;
  }
  .tab.active { background: var(--panel); color: var(--txt); border-bottom-color: var(--panel); font-weight: 600; }
  .layout { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  #ctrl { width: 340px; flex-shrink: 0; }
  #main { flex: 1; min-width: 560px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  label { font-size: 12px; color: var(--dim); min-width: 72px; }
  select, input[type=number] {
    background: #0d1117; color: var(--txt); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px; font-size: 13px; flex: 1; min-width: 90px;
  }
  input[type=range] { flex: 1; accent-color: var(--acc); }
  .tval { font-size: 16px; font-weight: 700; color: var(--acc); min-width: 44px; text-align: right; }
  .tlabel { font-size: 11px; color: var(--dim); margin-top: 4px; }
  button {
    background: var(--acc); color: #0d1117; border: none; border-radius: 6px;
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; margin-right: 8px;
  }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--txt); }
  button.gold { background: var(--warn); color: #0d1117; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
  .mcard { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .mcard .k { font-size: 11px; color: var(--dim); }
  .mcard .v { font-size: 15px; font-weight: 700; }
  .pos { color: var(--up); } .neg { color: var(--down); }
  canvas { width: 100%; height: 340px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
  th, td { border-bottom: 1px solid var(--border); padding: 5px 7px; text-align: right; white-space: nowrap; }
  th { color: var(--dim); font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
  .scroll { max-height: 260px; overflow-y: auto; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
  .chip.l { background: rgba(63,185,80,.15); color: var(--up); }
  .chip.s { background: rgba(248,81,73,.15); color: var(--down); }
  .chip.pass { background: rgba(63,185,80,.18); color: var(--up); }
  .chip.fail { background: rgba(248,81,73,.18); color: var(--down); }
  #status { color: var(--dim); font-size: 12px; margin-top: 8px; min-height: 18px; }
  .gridtable { width: 100%; font-size: 12px; margin-top: 8px; }
  .gridtable td, .gridtable th { padding: 4px 8px; }
  .best { background: rgba(88,166,255,.12); }
  .hint { font-size: 11px; color: var(--warn); margin-top: 4px; }
  .banner { border-radius: 6px; padding: 10px 12px; font-size: 13px; margin: 10px 0; border: 1px solid; }
  .banner.pass { background: rgba(63,185,80,.1); border-color: var(--up); }
  .banner.fail { background: rgba(248,81,73,.1); border-color: var(--down); }
  .sec { font-size: 13px; color: var(--dim); margin: 14px 0 6px; }
</style>
</head>
<body>
<h1>WyckoffAnalytics · 威科夫动态参数化交易终端</h1>
<div class="sub">温度控制 T∈[0.1,1.0] · 摩擦模型回测 · 多周期 HTF 确认 · 本地 AI 训练</div>

<div class="tabs">
  <div class="tab active" data-tab="bt">回测</div>
  <div class="tab" data-tab="train">AI 训练</div>
</div>

<!-- ==================== 回测页 ==================== -->
<div id="tab-bt">
<div class="layout">
  <div class="panel" id="ctrl">
    <div class="row"><label>标的/周期</label>
      <select id="selSymbol"></select><select id="selTf"></select>
    </div>
    <div class="row"><label>HTF确认</label>
      <select id="selHtf"><option value="">无 (单周期)</option></select>
    </div>
    <div class="row"><label>市场配置</label>
      <select id="selProfile">
        <option value="crypto">CRYPTO_PROFILE (7x24·高滑点)</option>
        <option value="equity">US_EQUITY_PROFILE (RTH·跳空过滤)</option>
      </select>
    </div>

    <div class="row"><span class="tlabel" style="min-width:72px">温度 T</span>
      <input type="range" id="sliderT" min="0.1" max="1.0" step="0.05" value="0.5">
      <span class="tval" id="tval">0.50</span>
    </div>
    <div id="tParams" style="font-size:11px;color:var(--dim);margin-bottom:10px;line-height:1.7"></div>

    <div class="row"><label>区间窗口</label><input type="number" id="inWindow" value="60" min="40" max="90" step="5"></div>
    <div class="row"><label>最大持有</label><input type="number" id="inHold" value="60" min="20" max="200" step="10"></div>
    <div class="row"><label>入场冷却</label><input type="number" id="inCooldown" value="5" min="0" max="40" step="1"></div>

    <div class="row">
      <button id="btnRun">▶ 运行回测</button>
      <button id="btnGrid" class="ghost">温度扫描</button>
    </div>
    <div class="hint">信号在bar收盘判定, t+1开盘成交; 含手续费+滑点+价差。</div>
    <div id="status"></div>
  </div>

  <div class="panel" id="main">
    <div class="metrics" id="metrics"></div>
    <canvas id="chart"></canvas>
    <div id="gridWrap" style="display:none"></div>
    <h3 style="font-size:13px;color:var(--dim);margin-top:12px" id="tradeTitle">交易明细</h3>
    <div class="scroll" id="tradesBox"><table id="tradesTable"></table></div>
  </div>
</div>
</div>

<!-- ==================== 训练页 ==================== -->
<div id="tab-train" style="display:none">
<div class="layout">
  <div class="panel" id="ctrlTrain">
    <div class="row"><label>训练标的</label><select id="trSymbol"></select><select id="trTf"></select></div>
    <div class="row"><label>HTF确认</label><select id="trHtf"><option value="">无 (单周期)</option></select></div>
    <div class="row"><label>市场配置</label><select id="trProfile">
      <option value="crypto">CRYPTO_PROFILE</option>
      <option value="equity">US_EQUITY_PROFILE</option></select></div>
    <div class="row"><label>贝叶斯轮次</label><input type="number" id="trTrials" value="30" min="10" max="80" step="5"></div>
    <div class="row"><label>验证折数</label><input type="number" id="trFolds" value="4" min="3" max="6" step="1"></div>
    <div class="row"><label>最少交易</label><input type="number" id="trMinTrades" value="30" min="5" max="60" step="5"></div>
    <div class="row"><button id="btnTrain" class="gold">⚡ 开始 AI 训练</button></div>
    <div class="hint">训练流程: 贝叶斯优化(真实历史数据) → 最优参数全量回测 → 交易准确率统计 → Walk-Forward 样本外验证(衰减&gt;30%自动否决) → 写入训练历史。耗时约1-5分钟。</div>
    <div id="trainStatus"></div>
  </div>

  <div class="panel" style="flex:1;min-width:560px">
    <div id="trainResult"></div>
    <div class="sec">训练历史 (不断迭代 → 准确率最高的预判)</div>
    <div class="scroll" style="max-height:340px" id="historyBox"></div>
  </div>
</div>
</div>

<script>
const $ = id => document.getElementById(id);
const api = async (url, body) => {
  const r = await fetch(url, { method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
};

let DATASETS = [];

function fmt(v, d = 2) { return v == null ? '-' : Number(v).toFixed(d); }
function pct(v, d = 2) { return (v * 100).toFixed(d) + '%'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- 标签页 ----------
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
  $('tab-bt').style.display = t.dataset.tab === 'bt' ? '' : 'none';
  $('tab-train').style.display = t.dataset.tab === 'train' ? '' : 'none';
  if (t.dataset.tab === 'train') loadHistory();
}));

// ---------- 数据集联动 ----------
function fillSymbols(symSel, tfSel, htfSel) {
  const groups = {};
  DATASETS.forEach(d => (groups[d.symbol] = groups[d.symbol] || []).push(d.tf));
  symSel.innerHTML = Object.keys(groups).sort().map(s => `<option>${s}</option>`).join('');
  const sync = () => {
    const tfs = DATASETS.filter(d => d.symbol === symSel.value).map(d => d.tf).sort();
    tfSel.innerHTML = tfs.map(t => `<option>${t}</option>`).join('');
    htfSel.innerHTML = '<option value="">无 (单周期)</option>' +
      tfs.filter(t => t !== tfSel.value).map(t => `<option>${t}</option>`).join('');
  };
  symSel.addEventListener('change', sync);
  tfSel.addEventListener('change', sync);
  sync();
}

// ---------- 回测页 ----------
async function updateTParams() {
  $('tval').textContent = $('sliderT').value;
  const p = await api('/api/temperature?T=' + $('sliderT').value);
  const fmtP = v => Array.isArray(v) ? '[' + v.map(x => x.toFixed(2)).join(', ') + ']' : (typeof v === 'number' ? v.toFixed(2) : v);
  $('tParams').innerHTML =
    `共振下限 <b>${fmtP(p['signal.factor_resonance_min'])}</b> · 止损 <b>${fmtP(p['risk.stop_atr_mult'])} ATR</b> · ` +
    `盈亏比 <b>${fmtP(p['risk.take_profit_rr'])}</b> · 仓位 <b>${fmtP(p['risk.position_pct'] * 100)}%</b> · ` +
    `最大持仓 <b>${fmtP(p['risk.max_positions'])}</b> · 日熔断 <b>${fmtP(p['risk.daily_loss_limit_pct'])}%</b> · ` +
    `趋势质量 ≥ <b>${fmtP(p['filters.regime_quality_min'])}</b> · 量能Z ≥ <b>${fmtP(p['filters.volume_zscore_min'])}</b>`;
}

function drawChart(dates, equity, drawdown) {
  const cv = $('chart'); const ctx = cv.getContext('2d');
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * devicePixelRatio; cv.height = H * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);
  const padL = 64, padR = 16, padT = 14, padB = 26;
  const pw = W - padL - padR, ph = H - padT - padB;
  const eqMin = Math.min(...equity), eqMax = Math.max(...equity);
  const ddMin = Math.min(...drawdown);
  const X = i => padL + (i / Math.max(1, dates.length - 1)) * pw;
  const YE = v => padT + (1 - (v - eqMin) / Math.max(eqMax - eqMin, 1e-9)) * ph * 0.72;
  const YD = v => padT + ph * 0.78 + (1 - v / Math.max(Math.abs(ddMin), 1e-9)) * ph * 0.22;
  ctx.strokeStyle = '#21262d'; ctx.fillStyle = '#8b949e'; ctx.font = '10px sans-serif';
  ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const y = padT + ph * 0.72 * g / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText(fmt(eqMax - (eqMax - eqMin) * g / 4), 4, y + 3);
  }
  for (let g = 0; g <= 4; g++) {
    const y = padT + ph * 0.78 + ph * 0.22 * g / 4;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.fillText((ddMin * (1 - g / 4) * 100).toFixed(1) + '%', 4, y + 3);
  }
  ctx.beginPath();
  drawdown.forEach((v, i) => { const x = X(i), y = YD(v); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.lineTo(X(drawdown.length - 1), padT + ph); ctx.lineTo(X(0), padT + ph); ctx.closePath();
  ctx.fillStyle = 'rgba(248,81,73,0.25)'; ctx.fill();
  ctx.beginPath();
  equity.forEach((v, i) => { const x = X(i), y = YE(v); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
  ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.6; ctx.stroke();
  const nTick = Math.min(6, dates.length);
  for (let i = 0; i < nTick; i++) {
    const ix = Math.round(i * (dates.length - 1) / Math.max(1, nTick - 1));
    ctx.fillText(dates[ix].slice(0, 10), X(ix) - 28, H - 8);
  }
  ctx.fillStyle = '#8b949e'; ctx.fillText('净值(上) / 回撤(下)', padL + 4, padT + 10);
}

function renderMetrics(m) {
  const cards = [
    ['总收益', pct(m.total_return)], ['年化 CAGR', pct(m.cagr)],
    ['Sharpe', fmt(m.sharpe)], ['Sortino', fmt(m.sortino)],
    ['Calmar', fmt(m.calmar)], ['最大回撤', pct(m.max_drawdown)],
    ['交易数', String(m.trades)], ['胜率', pct(m.win_rate, 1)],
    ['盈亏比 PF', fmt(m.profit_factor)], ['平均持有', fmt(m.avg_bars_held) + ' bar'],
  ];
  $('metrics').innerHTML = cards.map(([k, v]) => {
    const s = String(v);
    return `<div class="mcard"><div class="k">${k}</div><div class="v ${s.startsWith('-') ? 'neg' : 'pos'}">${s}</div></div>`;
  }).join('');
}

function renderTrades(trades, total) {
  const t = $('tradesTable');
  $('tradeTitle').textContent = `交易明细 (显示 ${trades.length}/${total} 笔)`;
  t.innerHTML = `<tr><th>进场</th><th>出场</th><th>方向</th><th>设置</th><th>入场价</th><th>出场价</th><th>盈亏%</th><th>原因</th><th>持有</th></tr>` +
    trades.map(x => `<tr>
      <td>${esc(x.entry_dt.slice(0, 16).replace('T', ' '))}</td><td>${esc(x.exit_dt.slice(0, 16).replace('T', ' '))}</td>
      <td><span class="chip ${x.dir === 1 ? 'l' : 's'}">${x.dir === 1 ? '多' : '空'}</span></td>
      <td>${esc(x.setup)}</td><td>${x.entry}</td><td>${x.exit}</td>
      <td class="${x.pnl_pct >= 0 ? 'pos' : 'neg'}">${fmt(x.pnl_pct)}%</td>
      <td>${esc(x.exit_reason)}</td><td>${x.bars_held}</td></tr>`).join('');
}

async function runBacktest() {
  const p = {
    symbol: $('selSymbol').value, tf: $('selTf').value, htf_tf: $('selHtf').value,
    profile: $('selProfile').value, T: parseFloat($('sliderT').value),
    feature_window: +$('inWindow').value, max_bars_hold: +$('inHold').value,
    entry_cooldown: +$('inCooldown').value,
  };
  $('btnRun').disabled = true; $('status').textContent = '回测运行中... (含摩擦模型, 请稍候)';
  $('gridWrap').style.display = 'none';
  try {
    const r = await api('/api/backtest', p);
    renderMetrics(r.metrics);
    drawChart(r.dates, r.equity, r.drawdown);
    renderTrades(r.trades, r.n_trades_total);
    const s = r.signals_summary;
    $('status').textContent =
      `${r.symbol} ${r.tf}${r.htf_tf ? ' +HTF:' + r.htf_tf : ''} · ${r.profile} · 信号 ${s.signals} (多${s.long}/空${s.short}) · ` +
      `数据 ${r.dates[0].slice(0, 10)} ~ ${r.dates[r.dates.length - 1].slice(0, 10)}`;
  } catch (e) { $('status').textContent = '错误: ' + e.message; }
  finally { $('btnRun').disabled = false; }
}

async function runGrid() {
  const p = {
    symbol: $('selSymbol').value, tf: $('selTf').value, htf_tf: $('selHtf').value,
    profile: $('selProfile').value, feature_window: +$('inWindow').value,
    max_bars_hold: +$('inHold').value, entry_cooldown: +$('inCooldown').value,
  };
  $('btnGrid').disabled = true; $('status').textContent = '温度扫描中 (5个温度点 × 全量回测)...';
  try {
    const r = await api('/api/grid', p);
    const rows = r.rows.map(x => `<tr class="${Math.abs(x.T - p.T) < 0.01 ? 'best' : ''}">
      <td><b>${x.T.toFixed(2)}</b></td><td>${pct(x.metrics.total_return)}</td>
      <td>${fmt(x.metrics.sharpe)}</td><td>${fmt(x.metrics.calmar)}</td>
      <td>${pct(x.metrics.max_drawdown)}</td><td>${x.metrics.trades}</td>
      <td>${pct(x.metrics.win_rate, 1)}</td><td>${fmt(x.metrics.profit_factor)}</td></tr>`).join('');
    $('gridWrap').style.display = 'block';
    $('gridWrap').innerHTML = `<h3 style="font-size:13px;color:var(--dim);margin-top:12px">温度扫描 (高亮=当前T)</h3>
      <table class="gridtable"><tr><th>T</th><th>收益</th><th>Sharpe</th><th>Calmar</th><th>MaxDD</th><th>交易</th><th>胜率</th><th>PF</th></tr>${rows}</table>`;
    $('status').textContent = '温度扫描完成';
  } catch (e) { $('status').textContent = '错误: ' + e.message; }
  finally { $('btnGrid').disabled = false; }
}

// ---------- 训练页 ----------
function renderTrainResult(r) {
  const m = r.is_metrics;
  const wf = r.walk_forward;
  const ok = !wf.vetoed;
  const bp = r.best_params;
  const foldRows = wf.folds.map(f => `<tr>
    <td>${f.fold}</td><td>${fmt(f.is_calmar)}</td><td>${fmt(f.oos_calmar)}</td>
    <td>${fmt(f.decay * 100, 0)}%</td><td>${f.oos_trades}</td></tr>`).join('');
  const setupRows = Object.entries(r.accuracy.by_setup).map(([k, v]) => `<tr>
    <td>${esc(k)}</td><td>${v.trades}</td><td>${pct(v.win_rate, 1)}</td><td>${fmt(v.pnl)}</td></tr>`).join('');
  $('trainResult').innerHTML = `
    <div class="banner ${ok ? 'pass' : 'fail'}">
      <b>${ok ? '✅ Walk-Forward 验证通过 (PASSED)' : '❌ 验证否决 (REJECTED: OOS衰减>30%)'}</b>
      — ${r.symbol} ${r.tf}${r.htf_tf ? ' +HTF:' + r.htf_tf : ''} · 第 ${r.round_id} 轮 · 适应度 ${fmt(r.fitness, 3)}
    </div>
    <div class="metrics">
      <div class="mcard"><div class="k">最优温度 T</div><div class="v">${fmt(bp.T)}</div></div>
      <div class="mcard"><div class="k">区间窗口</div><div class="v">${bp.feature_window}</div></div>
      <div class="mcard"><div class="k">最大持有</div><div class="v">${bp.max_bars_hold}</div></div>
      <div class="mcard"><div class="k">样本内收益</div><div class="v">${pct(m.total_return)}</div></div>
      <div class="mcard"><div class="k">Sharpe</div><div class="v">${fmt(m.sharpe)}</div></div>
      <div class="mcard"><div class="k">Calmar</div><div class="v">${fmt(m.calmar)}</div></div>
      <div class="mcard"><div class="k">MaxDD</div><div class="v">${pct(m.max_drawdown)}</div></div>
      <div class="mcard"><div class="k">交易数</div><div class="v">${m.trades}</div></div>
      <div class="mcard"><div class="k">准确率(胜率)</div><div class="v">${pct(r.accuracy.win_rate, 1)}</div></div>
      <div class="mcard"><div class="k">盈亏比 PF</div><div class="v">${fmt(m.profit_factor)}</div></div>
    </div>
    <div class="sec">样本外验证 (Walk-Forward ${wf.folds.length} 折)</div>
    <table><tr><th>折</th><th>IS Calmar</th><th>OOS Calmar</th><th>衰减率</th><th>OOS交易</th></tr>${foldRows}</table>
    <div class="sec">分设置准确率 (真实历史数据)</div>
    <table><tr><th>进场设置</th><th>交易数</th><th>胜率</th><th>累计盈亏</th></tr>${setupRows}</table>`;
}

function renderHistory(h) {
  const best = h.best_round;
  let html = '';
  if (best) {
    html += `<div class="banner pass"><b>🏆 当前最优轮次: 第 ${best.round_id} 轮</b> —
      ${esc(best.symbol)} ${best.tf}${best.htf_tf ? ' +HTF:' + best.htf_tf : ''} ·
      OOS Calmar ${fmt(best.best_oos_calmar)} · 准确率 ${pct(best.accuracy.win_rate, 1)} ·
      T=${fmt(best.best_params.T)} · ${best.ts.slice(0, 16).replace('T', ' ')}</div>`;
  }
  const rows = h.rounds.map(r => `<tr>
    <td>#${r.round_id}</td><td>${r.ts.slice(0, 16).replace('T', ' ')}</td>
    <td>${esc(r.symbol)} ${r.tf}${r.htf_tf ? '+' + r.htf_tf : ''}</td>
    <td>${fmt(r.fitness, 3)}</td><td>${pct(r.accuracy.win_rate, 1)}</td>
    <td>${fmt(r.is_metrics.calmar)}</td><td>${r.is_metrics.trades}</td>
    <td><span class="chip ${r.walk_forward.vetoed ? 'fail' : 'pass'}">${r.walk_forward.vetoed ? '否决' : '通过'}</span></td>
    <td>${fmt(r.best_params.T)} / ${r.best_params.feature_window} / ${r.best_params.max_bars_hold}</td></tr>`).join('');
  html += `<table><tr><th>轮次</th><th>时间</th><th>标的</th><th>适应度</th><th>准确率</th>
    <th>IS Calmar</th><th>交易</th><th>判定</th><th>T/窗口/持有</th></tr>${rows}</table>`;
  $('historyBox').innerHTML = html;
}

async function runTrain() {
  const body = {
    symbol: $('trSymbol').value, tf: $('trTf').value, htf_tf: $('trHtf').value,
    profile: $('trProfile').value, trials: +$('trTrials').value,
    folds: +$('trFolds').value, min_trades: +$('trMinTrades').value,
  };
  $('btnTrain').disabled = true;
  $('trainStatus').textContent = `训练中... (${body.trials} 次贝叶斯优化 + ${body.folds - 1} 折样本外验证, 约1-5分钟)`;
  $('trainResult').innerHTML = '';
  try {
    const r = await api('/api/train', body);
    renderTrainResult(r);
    $('trainStatus').textContent = `第 ${r.round_id} 轮训练完成: ${r.walk_forward.vetoed ? '被否决' : '通过'} · 准确率 ${pct(r.accuracy.win_rate, 1)}`;
    await loadHistory();
  } catch (e) { $('trainStatus').textContent = '训练错误: ' + e.message; }
  finally { $('btnTrain').disabled = false; }
}

async function loadHistory() {
  try {
    const h = await api('/api/train/history');
    renderHistory(h);
  } catch (e) { $('historyBox').innerHTML = '历史加载失败: ' + esc(e.message); }
}

// ---------- 初始化 ----------
(async () => {
  try {
    const st = await api('/api/status');
    DATASETS = st.datasets;
    fillSymbols($('selSymbol'), $('selTf'), $('selHtf'));
    fillSymbols($('trSymbol'), $('trTf'), $('trHtf'));
    $('selSymbol').value = DATASETS.some(d => d.symbol === 'BTC/USDT') ? 'BTC/USDT' : $('selSymbol').value;
    $('selSymbol').dispatchEvent(new Event('change'));
    $('trSymbol').value = $('selSymbol').value;
    $('trSymbol').dispatchEvent(new Event('change'));
    updateTParams();
    loadHistory();
  } catch (e) { $('status').textContent = '初始化失败: ' + e.message; }
})();

$('sliderT').addEventListener('input', updateTParams);
$('btnRun').addEventListener('click', runBacktest);
$('btnGrid').addEventListener('click', runGrid);
$('btnTrain').addEventListener('click', runTrain);
</script>
</body>
</html>
